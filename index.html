<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Profil Analizörü</title>
<style>
  body {
    font-family: Verdana, Tahoma, sans-serif;
    background: #eef2f7;
    color: #222;
    max-width: 720px;
    margin: 0 auto;
    padding: 30px 15px;
  }
  h1 { text-align: center; color: #1f4e79; margin-bottom: 5px; }
  .alt-baslik { text-align: center; color: #666; margin-top: 0; font-size: 14px; }
  form { display: flex; gap: 10px; margin: 25px 0; }
  input {
    flex: 1; padding: 10px; font-size: 15px;
    border: 1px solid #aab4c3; border-radius: 4px;
  }
  button {
    padding: 10px 18px; font-size: 15px; border: none; border-radius: 4px;
    background: #1f4e79; color: white; cursor: pointer;
  }
  button:hover { background: #2c6aa3; }
  .kart {
    background: white; border-radius: 6px; padding: 18px; margin-bottom: 15px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
  }
  .profil { display: flex; gap: 18px; align-items: center; }
  .profil img { width: 100px; height: 100px; border-radius: 50%; }
  .profil h2 { margin: 0; color: #1f4e79; }
  .profil a { color: #2c6aa3; }
  .bio { color: #555; margin: 6px 0 10px; font-size: 14px; }
  .sayilar { display: flex; gap: 20px; flex-wrap: wrap; }
  .sayilar div { text-align: center; }
  .sayilar b { display: block; font-size: 18px; }
  .sayilar span { color: #666; font-size: 12px; }
  .hata { color: #c0392b; text-align: center; }
  .yukleniyor { color: #666; text-align: center; }
  h3 { margin-top: 0; color: #1f4e79; border-bottom: 2px solid #eef2f7; padding-bottom: 6px; }
  .repo { padding: 8px 0; border-bottom: 1px solid #eee; }
  .repo:last-child { border-bottom: none; }
  .repo a { color: #2c6aa3; font-weight: bold; }
  .repo p { margin: 4px 0; color: #555; font-size: 13px; }
  .repo small { color: #777; }
  .dil-satir { display: flex; align-items: center; gap: 10px; margin: 7px 0; font-size: 13px; }
  .dil-ad { width: 100px; }
  .bar-dis { flex: 1; background: #e3e8ef; height: 12px; border-radius: 3px; }
  .bar-ic { height: 100%; background: #2c6aa3; border-radius: 3px; }
  .yuzde { width: 40px; text-align: right; color: #666; }
</style>
</head>
<body>
  <h1>GitHub Profil Analizörü</h1>
  <p class="alt-baslik">Bir GitHub kullanıcı adı yazın, profilini ve projelerini analiz edelim.</p>

  <form id="aramaFormu">
    <input type="text" id="kullaniciAdi" placeholder="Kullanıcı adı (ör. torvalds)">
    <button type="submit">Analiz Et</button>
  </form>

  <div id="sonuc"></div>

<script>
  const API = "https://api.github.com/users/";
  const sonuc = document.getElementById("sonuc");

  // API'den gelen yazılar HTML gibi çalışmasın diye düz metne çeviriyorum
  function guvenli(metin) {
    const div = document.createElement("div");
    div.textContent = metin ?? "";
    return div.innerHTML;
  }

  // ---------------- GÖREV 1: Profil kartı ----------------
  function profilKarti(k) {
    return `
      <div class="kart profil">
        <img src="${k.avatar_url}" alt="Profil fotoğrafı">
        <div>
          <h2>${guvenli(k.name || k.login)}</h2>
          <a href="${k.html_url}" target="_blank">@${guvenli(k.login)}</a>
          <p class="bio">${guvenli(k.bio || "Biyografi eklenmemiş.")}</p>
          <div class="sayilar">
            <div><b>${k.public_repos}</b><span>Repo</span></div>
            <div><b>${k.followers}</b><span>Takipçi</span></div>
            <div><b>${k.following}</b><span>Takip</span></div>
            <div><b>${new Date(k.created_at).getFullYear()}</b><span>Katılım</span></div>
          </div>
        </div>
      </div>`;
  }

  // ---------------- GÖREV 2: Repo ve dil analizi ----------------
  function populerRepolar(repolar) {
    const enIyi5 = [...repolar]
      .sort((a, b) => b.stargazers_count - a.stargazers_count)
      .slice(0, 5);

    if (enIyi5.length === 0) return `<div class="kart"><h3>En Popüler Repolar</h3><p>Public repo yok.</p></div>`;

    const liste = enIyi5.map(r => `
      <div class="repo">
        <a href="${r.html_url}" target="_blank">${guvenli(r.name)}</a>
        <p>${guvenli(r.description || "Açıklama yok")}</p>
        <small>Yıldız: ${r.stargazers_count} | Fork: ${r.forks_count} | ${guvenli(r.language || "-")}</small>
      </div>`).join("");

    return `<div class="kart"><h3>En Popüler 5 Repo</h3>${liste}</div>`;
  }

  function dilDagilimi(repolar) {
    // Her dilin kaç repoda kullanıldığını say
    const sayac = {};
    repolar.forEach(r => {
      if (r.language) sayac[r.language] = (sayac[r.language] || 0) + 1;
    });

    const toplam = Object.values(sayac).reduce((a, b) => a + b, 0);
    if (toplam === 0) return `<div class="kart"><h3>Dil Dağılımı</h3><p>Dil bilgisi yok.</p></div>`;

    const satirlar = Object.entries(sayac)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 6)
      .map(([dil, adet]) => {
        const yuzde = Math.round((adet / toplam) * 100);
        return `
          <div class="dil-satir">
            <span class="dil-ad">${guvenli(dil)}</span>
            <div class="bar-dis"><div class="bar-ic" style="width:${yuzde}%"></div></div>
            <span class="yuzde">%${yuzde}</span>
          </div>`;
      }).join("");

    return `<div class="kart"><h3>Dil Dağılımı</h3>${satirlar}</div>`;
  }

  // ---------------- Arama ----------------
  async function analizEt(kullanici) {
    sonuc.innerHTML = `<p class="yukleniyor">Yükleniyor...</p>`;
    try {
      const cevap = await fetch(API + encodeURIComponent(kullanici));
      if (cevap.status === 404) throw new Error("Kullanıcı bulunamadı.");
      if (cevap.status === 403) throw new Error("GitHub istek limiti doldu, biraz sonra tekrar deneyin.");
      if (!cevap.ok) throw new Error("Bir hata oluştu.");
      const profil = await cevap.json();

      const repoCevap = await fetch(API + encodeURIComponent(kullanici) + "/repos?per_page=100");
      const repolar = repoCevap.ok ? await repoCevap.json() : [];

      sonuc.innerHTML = profilKarti(profil) + populerRepolar(repolar) + dilDagilimi(repolar);
    } catch (hata) {
      sonuc.innerHTML = `<p class="hata">${guvenli(hata.message)}</p>`;
    }
  }

  document.getElementById("aramaFormu").addEventListener("submit", e => {
    e.preventDefault();
    const kullanici = document.getElementById("kullaniciAdi").value.trim();
    if (!kullanici) {
      sonuc.innerHTML = `<p class="hata">Lütfen bir kullanıcı adı yazın.</p>`;
      return;
    }
    analizEt(kullanici);
  });
</script>
</body>
</html>
