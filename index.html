<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Profil Analizörü</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #0d1117; color: #e6edf3;
    max-width: 760px; margin: 0 auto; padding: 32px 16px;
  }
  h1 { text-align: center; margin-bottom: 4px; }
  .alt-baslik { text-align: center; color: #8b949e; margin-top: 0; }
  form { display: flex; gap: 8px; margin: 24px 0; }
  input {
    flex: 1; padding: 12px; font-size: 16px; border-radius: 8px;
    border: 1px solid #30363d; background: #161b22; color: #e6edf3;
  }
  button {
    padding: 12px 20px; font-size: 16px; border: none; border-radius: 8px;
    background: #238636; color: white; cursor: pointer;
  }
  button:hover { background: #2ea043; }
  .kart {
    background: #161b22; border: 1px solid #30363d; border-radius: 12px;
    padding: 20px; margin-bottom: 16px;
  }
  .profil { display: flex; gap: 20px; align-items: center; }
  .profil img { width: 110px; height: 110px; border-radius: 50%; border: 2px solid #30363d; }
  .profil h2 { margin: 0; }
  .profil a { color: #58a6ff; text-decoration: none; }
  .bio { color: #8b949e; margin: 6px 0 12px; }
  .sayilar { display: flex; gap: 18px; flex-wrap: wrap; }
  .sayilar div { text-align: center; }
  .sayilar b { display: block; font-size: 20px; }
  .sayilar span { color: #8b949e; font-size: 13px; }
  .hata { color: #f85149; text-align: center; }
  .yukleniyor { color: #8b949e; text-align: center; }
  h3 { margin-top: 0; }
  .repo { padding: 10px 0; border-bottom: 1px solid #21262d; }
  .repo:last-child { border-bottom: none; }
  .repo a { color: #58a6ff; font-weight: bold; text-decoration: none; }
  .repo p { margin: 4px 0; color: #8b949e; font-size: 14px; }
  .repo small { color: #8b949e; }
  .dil-satir { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .dil-ad { width: 110px; font-size: 14px; }
  .bar-dis { flex: 1; background: #21262d; border-radius: 6px; height: 14px; overflow: hidden; }
  .bar-ic { height: 100%; background: #238636; }
  .yuzde { width: 48px; text-align: right; font-size: 14px; color: #8b949e; }
</style>
</head>
<body>
  <h1>🔍 GitHub Profil Analizörü</h1>
  <p class="alt-baslik">Bir GitHub kullanıcı adı yazın, profilini ve projelerini analiz edelim.</p>

  <form id="aramaFormu">
    <input type="text" id="kullaniciAdi" placeholder="Kullanıcı adı (ör. torvalds)">
    <button type="submit">Analiz Et</button>
  </form>

  <div id="sonuc"></div>

<script>
  const API = "https://api.github.com/users/";
  const sonuc = document.getElementById("sonuc");

  // Kullanıcıdan gelen metni güvenli şekilde ekrana basmak için
  function guvenli(metin) {
    const div = document.createElement("div");
    div.textContent = metin ?? "";
    return div.innerHTML;
  }

  // ---------------- GÖREV 1: Profil kartı ----------------
  function profilKarti(k) {
    return `
      <div class="kart profil">
        <img src="${k.avatar_url}" alt="Profil fotoğrafı">
        <div>
          <h2>${guvenli(k.name || k.login)}</h2>
          <a href="${k.html_url}" target="_blank">@${guvenli(k.login)}</a>
          <p class="bio">${guvenli(k.bio || "Biyografi eklenmemiş.")}</p>
          <div class="sayilar">
            <div><b>${k.public_repos}</b><span>Repo</span></div>
            <div><b>${k.followers}</b><span>Takipçi</span></div>
            <div><b>${k.following}</b><span>Takip</span></div>
            <div><b>${new Date(k.created_at).getFullYear()}</b><span>Katılım</span></div>
          </div>
        </div>
      </div>`;
  }

  // ---------------- Arama ----------------
  async function analizEt(kullanici) {
    sonuc.innerHTML = `<p class="yukleniyor">Yükleniyor...</p>`;
    try {
      const cevap = await fetch(API + encodeURIComponent(kullanici));
      if (cevap.status === 404) throw new Error("Kullanıcı bulunamadı.");
      if (cevap.status === 403) throw new Error("GitHub istek limiti doldu, biraz sonra tekrar deneyin.");
      if (!cevap.ok) throw new Error("Bir hata oluştu.");
      const profil = await cevap.json();

      sonuc.innerHTML = profilKarti(profil);
    } catch (hata) {
      sonuc.innerHTML = `<p class="hata">❌ ${guvenli(hata.message)}</p>`;
    }
  }

  document.getElementById("aramaFormu").addEventListener("submit", e => {
    e.preventDefault();
    const kullanici = document.getElementById("kullaniciAdi").value.trim();
    if (!kullanici) {
      sonuc.innerHTML = `<p class="hata">Lütfen bir kullanıcı adı yazın.</p>`;
      return;
    }
    analizEt(kullanici);
  });
</script>
</body>
</html>
